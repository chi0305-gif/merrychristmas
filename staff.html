<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeDe 活動後台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root { --paper:#FBF6EC; --card:#FFFDF8; --ink:#3B2F2A; --soft:#7A6A60; --line:#E7DCCB; --red:#C23A2E; --green:#2E5B45; --gold:#C79A3B;
  --story:"LXGW WenKai TC","Kaiti TC",serif; --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui); line-height:1.6; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; display:grid; gap:24px; }
h1,h2 { font-family:var(--story); margin:0; }
.card { background:var(--card); border-radius:18px; padding:20px; box-shadow: inset 0 0 0 1px var(--line); display:grid; gap:12px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input { font:inherit; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:#fff; min-width:0; }
input.url { flex:1; min-width:240px; }
button { font:inherit; font-weight:700; border:0; border-radius:999px; padding:10px 18px; background:var(--red); color:#fff; cursor:pointer; }
button.g { background:var(--green); }
.note { font-size:13px; color:var(--soft); }
.ok { color:var(--green); font-weight:700; } .bad { color:var(--red); font-weight:700; }
.posters { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
.poster { background:#fff; border-radius:16px; border:3px solid var(--green); padding:18px; text-align:center; display:grid; gap:6px; justify-items:center; page-break-inside: avoid; break-inside: avoid; position:relative; padding-bottom:34px; }
.poster .no { font-size:13px; letter-spacing:.2em; color:var(--red); font-weight:700; }
.poster h3 { font-family:var(--story); font-size:24px; margin:0; }
.poster .qr { padding:10px; background:#fff; }
.poster .qr svg { width: 200px; height: 200px; display:block; }
.poster .place { font-size:14px; color:var(--soft); }
.poster .code { position:absolute; right:12px; bottom:8px; font-size:12px; color:var(--soft); }
.poster .code b { font-size:15px; color:var(--ink); letter-spacing:.15em; }
table { border-collapse: collapse; width:100%; font-size:14px; }
td, th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
.tw { overflow-x:auto; }
@media print { .noprint { display:none !important; } body { background:#fff; } .wrap { padding:0; } .posters { grid-template-columns: 1fr 1fr; } .poster { min-height: 46vh; align-content:center; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="noprint"><h1>SWSH Christmas Reading Quest · 工作人員後台</h1>
    <p class="note">這一頁只給工作人員使用，請不要把網址公開給學生。</p></header>

  <section class="card noprint">
    <h2>1. 核對完賽驗證碼</h2>
    <p class="note">輸入學生證書上的「小隊名稱」、「完賽時刻」與「驗證碼」，確認證書不是改過或截圖別人的。</p>
    <form class="row" id="vf">
      <input id="vTeam" placeholder="小隊名稱（完全一樣）" required>
      <input id="vDate" type="datetime-local" required>
      <input id="vCode" placeholder="驗證碼 5 碼" maxlength="5" style="width:130px;text-transform:uppercase" required>
      <button class="g">核對</button>
    </form>
    <p id="vOut" aria-live="polite"></p>
  </section>

  <section class="card noprint">
    <h2>2. 列印 QR Code 立牌</h2>
    <p class="note">填入遊戲上線後的網址（dede-quest.html 的網址），按「產生立牌」後用瀏覽器列印（每頁兩張）。立牌右下角的地點代碼是給掃不到 QR Code 的組別手動輸入用。</p>
    <div class="row"><input class="url" id="base" type="url" placeholder="https://你的網址/dede-quest.html"><button id="gen">產生立牌</button><button class="g" onclick="window.print()">列印</button></div>
    <div class="tw"><table id="tbl"></table></div>
  </section>

  <div class="posters" id="posters"></div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script>
const C = window.QUEST_CONFIG;
const base = document.getElementById("base");
base.value = location.href.replace(/staff\.html.*$/, "index.html");

function gen() {
  const url = base.value.trim().split("#")[0];
  if (!/^https?:\/\//.test(url)) {
    document.getElementById("tbl").innerHTML = "<tr><td>請先在上方填入遊戲上線後的網址（https:// 開頭），再按「產生立牌」。</td></tr>";
    document.getElementById("posters").innerHTML = ""; return;
  }
  const items = [{ no: "START", title: "活動入口", place: C.stages[0].place, href: url, code: "" }]
    .concat(C.stages.map(s => ({ no: "第 " + s.id + " 關", title: s.title, place: s.place, href: url + "#" + s.key, code: s.code })));
  document.getElementById("tbl").innerHTML = "<tr><th>立牌</th><th>地點</th><th>地點代碼</th><th>網址</th></tr>" +
    items.map(i => `<tr><td>${i.no}</td><td>${i.place}</td><td>${i.code || "—"}</td><td style="word-break:break-all">${i.href}</td></tr>`).join("");
  const box = document.getElementById("posters"); box.innerHTML = "";
  items.forEach(i => {
    const d = document.createElement("div"); d.className = "poster";
    d.innerHTML = `<div class="no">${i.no}</div><h3>${i.title}</h3><div class="place">📍 ${i.place}</div><div class="qr"></div>
      <div class="note">${i.no === "START" ? "掃描開始 DeDe 的聖誕閱讀冒險" : "掃描打開這一關"}</div>${i.code ? `<div class="code">地點代碼 <b>${i.code}</b></div>` : ""}`;
    box.appendChild(d);
    const q = qrcode(0, "M"); q.addData(i.href); q.make(); d.querySelector(".qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  });
}
document.getElementById("gen").onclick = gen; gen();

document.getElementById("vf").addEventListener("submit", e => {
  e.preventDefault();
  const team = document.getElementById("vTeam").value.trim();
  const dt = document.getElementById("vDate").value; // YYYY-MM-DDTHH:MM
  const stamp = dt.replace(/[-T:]/g, "");
  const want = window.questCode(team + "|" + stamp + "|" + C.salt);
  const got = document.getElementById("vCode").value.trim().toUpperCase();
  const out = document.getElementById("vOut");
  out.innerHTML = got === want ? `<span class="ok">✔ 驗證成功，可以兌換禮物。</span>` : `<span class="bad">✘ 驗證碼不符。</span> <span class="note">請確認小隊名稱一字不差、完賽時刻（含年份）正確。</span>`;
});
</script>
</body>
</html>
